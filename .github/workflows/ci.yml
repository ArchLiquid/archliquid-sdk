name: SDK

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]

# A same-repository push and PR update can target the same source branch.
# Keep the newest run and avoid spending the full matrix on both events.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 20.18.0 checks the retained minimum; 22/24 cover maintained releases.
        node: ["20.18.0", "22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run check:package -- --skip-check
